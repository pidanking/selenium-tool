services:
  selenium-tool:
    build:
      context: .
      dockerfile: Dockerfile
    image: pidanking/selenium-tool:v1.5.0
    container_name: selenium-tool
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SE_VNC_PASSWORD: admin
      JAVA_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - ./config/custom.yml:/app/config/custom.yml:ro
      - ./data/cookie-store.json:/app/data/cookie-store.json
      - ./data/cookiecloud-cache.json:/app/data/cookiecloud-cache.json
    ports:
      - "8080:8080"
      - "7900:7900"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/cookies"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
