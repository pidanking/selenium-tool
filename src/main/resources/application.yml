spring:
  application:
    name: selenium-tool
  main:
    banner-mode: "off"
  profiles:
    active: dev
  config:
    import:
      # 代理和目标站点配置已拆分到 custom.yml，方便单独修改
      # JAR 同级目录放置同名文件可覆盖 classpath 中的默认值
      - "classpath:custom.yml"
      - "optional:file:/app/config/custom.yml"
# 自动化任务主配置
automation:
  # 启动应用后是否立刻执行一次任务
  run-on-startup: true
  schedule:
    # 定时任务使用的时区
    zone: "Asia/Shanghai"
  browser:
    # true 表示无界面运行，服务器和 Docker 环境建议开启
    headless: false
    # Linux 容器环境通常需要开启
    no-sandbox: true
    # Docker 中共享内存较小时建议开启
    disable-dev-shm-usage: true
    # 每个页面打开后的停留时间，单位秒
    page-stay-seconds: 3
    # 页面加载超时时间
    page-load-timeout: 120s
    driver-path:
    # 额外的浏览器启动参数
    arguments:
      - "--window-size=1400,900"
      - "--disable-gpu"
  cookie-cloud:
    # 缓存文件名
    cache-file: "cookiecloud-cache.json"
