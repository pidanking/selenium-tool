services:
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: selenium
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SE_VNC_PASSWORD: admin
    shm_size: "2g"
    ports:
      - "7900:7900"

  app:
    image: ghcr.io/pidanking/selenium-tool:v1.8.0
    container_name: selenium-tool
    restart: unless-stopped
    depends_on:
      - selenium
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms128m -Xmx256m"
      # Spring Boot 自动映射为 automation.browser.remote-url
      AUTOMATION_BROWSER_REMOTE_URL: "http://selenium:4444"
    volumes:
      - ./config/custom.yml:/app/config/custom.yml:ro
      - ./data:/app/data
    ports:
      - "8080:8080"
